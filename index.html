  header {

  .header-actions { display: flex; gap: 8px; }
  .btn {
    font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 600;

    background: var(--card); color: var(--text); cursor: pointer; transition: background 0.15s, transform 0.1s;

  .btn:hover { background: #f0f0f0; } .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--green); color: #fff; border-color: var(--green); }

  .btn-ghost { background: transparent; border-color: rgba(255,255,255,0.3); color: #fff; font-size: 12px; }

  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-danger { color: var(--red); border-color: #f5c6c3; }

    border: 1.5px solid var(--border); background: var(--card); color: var(--muted); cursor: pointer; transition: all 0.15s;
  }
  .div-tab:hover { border-color: #aaa; color: var(--text); }
  .div-tab.active { color: #fff; border-color: transparent; }
  .main-nav { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 2px solid var(--border); overflow-x:auto; }
  .nav-tab {
    font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-size: 14px; font-weight: 400;
    letter-spacing: 0.5px; text-transform: uppercase; padding: 10px 20px;
    border: none; background: transparent; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -2px; transition: color 0.15s; white-space: nowrap;
  }
  .nav-tab:hover { color: var(--text); } .nav-tab.active { color: var(--green); border-bottom-color: var(--green); }
  .card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px; }
  .search-bar { display: flex; gap: 10px; margin-bottom: 14px; align-items: center; }

    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius);

  }

  .filter-chip:hover { border-color: #aaa; } .filter-chip.active { background: #222; color: #fff; border-color: #222; }
  .game-list { display: flex; flex-direction: column; gap: 6px; }

  .game-row:hover { box-shadow: var(--shadow); }
  .game-row.is-final { border-left: 3px solid var(--green); }
  .game-row.is-champ { border-left: 3px solid var(--gold); }
  .game-time-col { min-width: 92px; text-align: right; }

  .score { font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif; font-size: 18px; font-weight: 400; min-width: 22px; text-align: center; }
  .score.win { color: var(--green); } .score.loss { color: var(--red); } .score.tie { color: var(--muted); }
  .vs-sep { font-size: 11px; color: var(--muted); margin: 0 2px; }
  .game-meta { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 600; white-space: nowrap; }

    .game-actions { width: 100%; }

    .standings-table th, .standings-table td { padding: 7px 5px; }

    .matrix-table { min-width: 0; font-size: 11px; table-layout: fixed; }
    .matrix-table th, .matrix-table td { padding: 6px 3px; word-break: break-word; }
    .matrix-table th:first-child, .matrix-table td:first-child { position: static; width: 30%; }
    .scoreboard-grid { grid-template-columns: 1fr; }
    footer { font-size: 11px; padding: 12px 8px; }
  }
